global:
  scrape_interval: 5s

scrape_configs:
  - job_name: openinsure
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - consent-service:8080
          - policy-service:8080
          - claim-service:8080
          - claim-worker:8080
          - notification-service:8080
          - provider-service:8080
