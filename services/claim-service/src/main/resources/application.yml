spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8090/realms/openinsure}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://keycloak:8080/realms/openinsure/protocol/openid-connect/certs}
  application:
    name: claim-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openinsure?currentSchema=claim_data}
    username: ${SPRING_DATASOURCE_USERNAME:openinsure}
    password: ${SPRING_DATASOURCE_PASSWORD:openinsure-local-only}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: claim_data
  flyway:
    locations: classpath:db/migration
    schemas: claim_data
    default-schema: claim_data
    create-schemas: true
server:
  port: ${SERVER_PORT:8083}
app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:1000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
