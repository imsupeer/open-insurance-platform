name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify with Maven
        run: ./mvnw verify
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OpenAPI contracts
        run: npx --yes @redocly/cli@1.34.1 lint contracts/http/*.yaml
      - name: Validate event contracts are valid JSON
        shell: bash
        run: node -e "for (const file of ['contracts/events/claim-created-v1.json','contracts/events/claim-notification-v1.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'));"
      - name: Validate Compose configuration
        run: docker compose config
      - name: Validate optional Compose profiles
        run: docker compose --profile aws-lab --profile observability config
      - name: Build service images
        run: |
          docker build --build-arg SERVICE_MODULE=consent-service -t openinsure-consent-service:ci .
          docker build --build-arg SERVICE_MODULE=policy-service -t openinsure-policy-service:ci .
          docker build --build-arg SERVICE_MODULE=claim-service -t openinsure-claim-service:ci .
          docker build --build-arg SERVICE_MODULE=claim-worker -t openinsure-claim-worker:ci .
          docker build --build-arg SERVICE_MODULE=notification-service -t openinsure-notification-service:ci .
